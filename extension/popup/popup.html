<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentryl — Email Forensic Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="popup">

  <!-- header -->
  <div class="p-header">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 3 27 8v9c0 8-5 12.5-11 13-6-.5-11-5-11-13V8L16 3Z" stroke="#3fe8d4" stroke-width="1.8"/><path d="M9 16h14" stroke="#3fe8d4" stroke-width="1.8" opacity="0.6"/><circle cx="9" cy="16" r="1.5" fill="#3fe8d4"/></svg>
      <div>
        <div class="brand-name">Sentryl</div>
        <div class="brand-sub mono">FORENSIC SHIELD</div>
      </div>
    </div>
    <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">ACTIVE</span></div>
  </div>

  <!-- Live Demo Simulator Strip -->
  <div class="demo-strip">
    <div class="demo-strip-label mono">⚡ LIVE SIH DEMO SIMULATOR:</div>
    <div class="demo-buttons">
      <button class="btn-scenario danger" data-scenario="paypal_phish" title="Phishing & Lookalike Domain">🚨 PayPal</button>
      <button class="btn-scenario warn" data-scenario="bec_wire" title="Business Email Compromise">⚠️ BEC Wire</button>
      <button class="btn-scenario warn" data-scenario="ms365_creds" title="Credential Harvesting">🔑 M365</button>
      <button class="btn-scenario safe" data-scenario="legit_google" title="Legitimate Clean Email">🛡️ Safe</button>
    </div>
  </div>

  <!-- current email being scanned -->
  <div class="target" id="targetStrip">
    <div class="target-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
    </div>
    <div class="target-text">
      <div class="target-from" id="targetFrom">Select an email in Gmail…</div>
      <div class="target-subj" id="targetSubj">Or click a demo test scenario above</div>
    </div>
  </div>

  <div class="scan-meta">
    <span class="live" id="scanStatus">engine ready</span>
    <span id="scanTime">0.05s</span>
  </div>

  <!-- results state -->
  <div class="results-state" id="resultsState">

    <!-- risk score -->
    <div class="score-section">
      <div class="ring-wrap">
        <svg viewBox="0 0 84 84">
          <circle class="ring-bg" cx="42" cy="42" r="36"/>
          <circle class="ring-fg" id="ringFg" cx="42" cy="42" r="36"/>
        </svg>
        <div class="ring-label">
          <div class="ring-num" id="riskScore">0</div>
          <div class="ring-max mono">/ 100</div>
        </div>
      </div>
      <div class="score-copy">
        <span class="score-tag" id="riskTag">SCANNING</span>
        <div class="score-headline" id="scoreHeadline">Analyzing indicators…</div>
        <div class="score-sub" id="scoreSub">Open any email to scan.</div>
      </div>
    </div>

    <!-- indicator checks -->
    <div class="checks" id="checksList">
      <!-- dynamically populated -->
    </div>

    <!-- link to extended analysis -->
    <a class="full-analysis" href="#" id="fullAnalysisLink">
      <div class="fa-left">
        <div class="fa-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
        </div>
        <div>
          <div class="fa-text-title">View Extended Forensic Dossier</div>
          <div class="fa-text-sub">Interactive Geolocation Map & Relay Path</div>
        </div>
      </div>
      <svg class="fa-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>

  <!-- actions -->
  <div class="p-footer">
    <button class="btn-primary" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M12 9v6"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
      Export Forensic Evidence
    </button>
    <button class="btn-ghost" id="scanCurrentBtn" title="Rescan Open Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    </button>
  </div>

</div>

<script src="../engine/detector.js"></script>
<script src="../engine/simulation.js"></script>
<script src="popup.js"></script>
</body>
</html>
